        <path fill-rule="evenodd" d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z"/>
      </svg>
      <text class="stat-label" x="25" y="0">Public Repos:</text>
      <text class="stat-val" x="145" y="0">12</text>
    </g>
  </g>

  <!-- Right Column: Top Languages Breakdown -->
  <g transform="translate(260, 48)">
    <g transform="translate(0, 20)">
      <circle cx="4" cy="-4" r="4" fill="#3572A5" />
      <text class="lang-label" x="14" y="0">Python</text>
      <text class="diff-val" x="205" y="0" text-anchor="end">41.7%</text>
      <rect class="bar-bg" x="0" y="6" width="205" height="5" />
      <rect x="0" y="6" width="85" height="5" fill="#3572A5" rx="2.5px" />
    </g>
    <g transform="translate(0, 48)">
      <circle cx="4" cy="-4" r="4" fill="#DA5B0B" />
      <text class="lang-label" x="14" y="0">Jupyter Notebook</text>
      <text class="diff-val" x="205" y="0" text-anchor="end">25.0%</text>
      <rect class="bar-bg" x="0" y="6" width="205" height="5" />
      <rect x="0" y="6" width="51" height="5" fill="#DA5B0B" rx="2.5px" />
