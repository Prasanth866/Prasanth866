    <g transform="translate(0, 76)">
      <circle cx="4" cy="-4" r="4" fill="#3178C6" />
      <text class="lang-label" x="14" y="0">TypeScript</text>
      <text class="diff-val" x="205" y="0" text-anchor="end">25.0%</text>
      <rect class="bar-bg" x="0" y="6" width="205" height="5" />
      <rect x="0" y="6" width="51" height="5" fill="#3178C6" rx="2.5px" />
    </g>
    <g transform="translate(0, 104)">
      <circle cx="4" cy="-4" r="4" fill="#F1E05A" />
      <text class="lang-label" x="14" y="0">JavaScript</text>
      <text class="diff-val" x="205" y="0" text-anchor="end">8.3%</text>
      <rect class="bar-bg" x="0" y="6" width="205" height="5" />
      <rect x="0" y="6" width="17" height="5" fill="#F1E05A" rx="2.5px" />
    </g>
